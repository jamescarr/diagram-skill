name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run agentskills validate skills/excalidraw-architecture
      - run: python3 skills/excalidraw-architecture/scripts/eip_excalidraw.py build skills/excalidraw-architecture/examples/order-flow.spec.json --check --strict
      - run: uv run pytest -q
