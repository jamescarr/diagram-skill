name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # newest stable release from actions/node-versions; `latest` would pick a nodejs.org prerelease
        with: { node-version: "*", check-latest: true }
      - uses: astral-sh/setup-uv@v10.3.3
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run agentskills validate skills/excalidraw-architecture
      - run: python3 skills/excalidraw-architecture/scripts/eip_excalidraw.py build skills/excalidraw-architecture/examples/order-flow.spec.json --check --strict
      - run: python3 tools/stencils.py --check
      - run: uv run pytest -q
